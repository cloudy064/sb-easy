name: CI

on:
  push:
    branches: [master, "feat/**", "rewrite/**"]
  pull_request:
    branches: [master]

jobs:
  c:
    name: C backend (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc git pkg-config libcurl4-openssl-dev libyaml-dev libsqlite3-dev libssl-dev
      - name: Configure
        shell: bash
        run: |
          flags=()
          if [[ '${{ matrix.mode }}' == sanitizers ]]; then
            flags+=('-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' '-DCMAKE_EXE_LINKER_FLAGS=-no-pie')
          fi
          cmake -S c -B build/c -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSB_EASY_WARNINGS_AS_ERRORS=ON "${flags[@]}"
      - name: Build
        run: cmake --build build/c --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/c --output-on-failure --timeout 180 --parallel 2

  c-embedded:
    name: C agent with embedded sing-box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: c/Dockerfile.unified
          target: runtime
          push: false
          tags: sb-easy:c-embedded-ci

  cpp:
    name: C++ backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libjsoncpp-dev libsqlite3-dev libssl-dev uuid-dev zlib1g-dev
      - name: Configure
        run: cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release -DSB_EASY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/cpp --parallel 2
      - name: Test
        run: ctest --test-dir build/cpp --output-on-failure

  rust-rollback:
    name: Rust rollback baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sb-easy:ci
