# sb-easy — all-in-one panel that supervises the bundled sing-box in process.
# No separate sing-box install: the image contains and manages it.
#
# Host networking is used because sb-easy is a VPN gateway: the WireGuard hub
# (UDP 51820), sing-box tun, and Clash API all need to live in the host network
# namespace, exactly like a bare-metal install.
#
# Quick start:
#   JWT_SECRET=$(openssl rand -hex 32) EXTERNAL_HOSTNAME=your.host \
#     docker compose up -d --build
#
# NOTE: do not run this on a box that already runs sing-box on :9090 / a tun —
# the managed instance would conflict. Stop the old one first.

services:
  sb-easy:
    build: .
    image: sb-easy:latest
    container_name: sb-easy
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN          # wg / ip / iptables / tun
      - SYS_MODULE         # load the wireguard kernel module if absent
    devices:
      - /dev/net/tun:/dev/net/tun   # sing-box tun inbound
    # NOTE: with host networking, sysctls must be set on the HOST (the container
    # can't set host-namespace sysctls). Ensure on the host:
    #   net.ipv4.ip_forward=1   (and src_valid_mark=1 if you enable WireGuard)
    volumes:
      - ./data:/app/data            # DB + generated sing-box config persist here
      - ./downloads:/app/frontend/dist/downloads:ro # downloadable client artifacts
    environment:
      - BIND_ADDR=${BIND_ADDR:-0.0.0.0:51821}
      - DATABASE_URL=${DATABASE_URL:-sqlite:/app/data/sb-easy.db?mode=rwc}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - CONFIG_HASH_SEED=${CONFIG_HASH_SEED:-}
      - EXTERNAL_HOSTNAME=${EXTERNAL_HOSTNAME:-127.0.0.1}
      - SINGBOX_API_URL=${SINGBOX_API_URL:-http://127.0.0.1:9090}
      - SINGBOX_API_SECRET=${SINGBOX_API_SECRET:-}
      - SINGBOX_MANAGED=${SINGBOX_MANAGED:-true}
      - SELF_SINGBOX_CONFIG_PATH=${SELF_SINGBOX_CONFIG_PATH:-/app/data/sing-box.gen.json}
      - SELF_SINGBOX_INTERVAL=${SELF_SINGBOX_INTERVAL:-10}
      - WG_ENABLED=${WG_ENABLED:-true}
      - WG_INTERFACE=${WG_INTERFACE:-wg0}
      - WG_PORT=${WG_PORT:-51820}
      - WG_ADDRESS=${WG_ADDRESS:-10.59.32.1/24}
      - WG_DNS=${WG_DNS:-10.59.32.1}
      - WG_MTU=${WG_MTU:-1420}
      - WG_EGRESS=${WG_EGRESS:-eth0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:$${BIND_ADDR##*:}/api/system/status\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
