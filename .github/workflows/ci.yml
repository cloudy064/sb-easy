name: CI

on:
  push:
    branches: [master, "feat/**", "rewrite/**"]
  pull_request:
    branches: [master]

jobs:
  runtime-pins:
    name: Immutable runtime manifest and download verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/runtime-manifest.py check
      - run: python scripts/test-runtime-manifest.py
      - run: python scripts/client-release.py check
      - run: python scripts/test-client-release.py

  http-debug-engine:
    name: Local HTTPS decryption, replay and packaged engine
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: extensions/http-debug/requirements-windows.lock
      - name: Install pinned engine dependencies
        run: python -m pip install -r extensions/http-debug/requirements-windows.lock
      - name: Verify TLS, plaintext, edits, replay, HAR and restricted controls
        run: python extensions/http-debug/tests/test_engine.py
      - name: Build standalone optional worker
        run: python -m PyInstaller --noconfirm --onefile --name sb-easy-http-debug --distpath build/http-debug --workpath build/http-debug-freeze --specpath build --paths extensions/http-debug --collect-all mitmproxy --collect-all mitmproxy_rs --copy-metadata mitmproxy --collect-all mitmproxy_windows extensions/http-debug/worker.py
      - name: Verify packaged worker
        run: python extensions/http-debug/tests/worker_smoke.py build/http-debug/sb-easy-http-debug.exe

  windows:
    name: Windows C11 desktop preview (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify native fixture signing dependency
        shell: pwsh
        run: |
          openssl version
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL CLI is required for native plugin fixtures.' }
      - name: Read application version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content config/client-releases.json -Raw | ConvertFrom-Json).development.windows.version
          "windows=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows/ui/package-lock.json
      - name: Build UI, native service and desktop; run tests
        shell: pwsh
        run: ./windows/scripts/build.ps1
      - name: Reject untrusted or tampered release manifests
        shell: pwsh
        run: ./windows/tests/release_signing_test.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned MSI build tools
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path build/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX install failed' }
          ./build/wix/wix.exe extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI install failed' }
      - name: Package portable ZIP and MSI with verified core
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          ./windows/scripts/package.ps1 -Msi -IncludeCore -WixPath ./build/wix/wix.exe
          $payload = Get-ChildItem build -Directory -Filter 'windows-package-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./windows/scripts/package-msi.ps1 -Payload $payload.FullName -Version 0.3.99 -WixPath ./build/wix/wix.exe
      - name: Verify MSI install, upgrade, repair, downgrade rejection and uninstall
        shell: pwsh
        run: |
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          if (-not $runtime.pv -or $runtime.pv -eq '0.0.0.0') {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/WebView2Setup.exe
            $setup = Start-Process ./build/WebView2Setup.exe -ArgumentList '/silent /install' -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw 'WebView2 Runtime installation failed' }
          }
          ./windows/scripts/installer-smoke.ps1 -Msi build/sb-easy-${{ steps.app_version.outputs.windows }}-windows-x64.msi -PreviousMsi build/sb-easy-0.3.99-windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: sb-easy-windows-x64-packages
          if-no-files-found: error
          path: |
            build/sb-easy-${{ steps.app_version.outputs.windows }}-windows-x64-portable.zip
            build/sb-easy-${{ steps.app_version.outputs.windows }}-windows-x64.msi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-test-logs
          path: build/windows-installer-smoke-*/

  c:
    name: C backend (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc git pkg-config libcurl4-openssl-dev libyaml-dev libsqlite3-dev libssl-dev
      - name: Configure
        shell: bash
        run: |
          flags=()
          if [[ '${{ matrix.mode }}' == sanitizers ]]; then
            flags+=('-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' '-DCMAKE_EXE_LINKER_FLAGS=-no-pie')
          fi
          cmake -S c -B build/c -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSB_EASY_WARNINGS_AS_ERRORS=ON "${flags[@]}"
      - name: Build
        run: cmake --build build/c --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/c --output-on-failure --timeout 180 --parallel 2

  c-embedded:
    name: C agent with embedded sing-box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: c/Dockerfile.unified
          target: runtime
          push: false
          tags: sb-easy:c-embedded-ci

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx vue-tsc --noEmit
      - name: Encrypted archive interoperability and rejection tests
        run: node --experimental-strip-types --test tests/secureArchive.test.mjs
      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify embedded proxy authorization and lifecycle under the race detector
        uses: docker/build-push-action@v6
        with:
          context: .
          target: singbox-bridge-tests
          push: false
      - name: Verify C embedded server and agents with real TCP/UDP clients
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-tests
          push: false
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sb-easy:ci
