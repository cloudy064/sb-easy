<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.sbeasy.Desktop.Tunnel"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.sbeasy.Desktop.Tunnel" send_interface="io.sbeasy.Desktop.Tunnel1"/>
    <allow send_destination="io.sbeasy.Desktop.Tunnel" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.sbeasy.Desktop.Tunnel" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
