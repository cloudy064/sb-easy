plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'io.sbeasy.httpdebug'
    compileSdk 36
    defaultConfig {
        applicationId 'io.sbeasy.httpdebug'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        python {
            version '3.13'
            buildPython System.getenv('SB_PYTHON') ?: 'python3.13'
            pip {
                install 'mitmproxy==12.2.3'
                options '--find-links', System.getenv('SB_ANDROID_WHEELS') ?: '../../../../build/chaquopy-wheels'
            }
        }
    }
    flavorDimensions 'abi'
    productFlavors {
        arm64 { dimension 'abi'; ndk { abiFilters 'arm64-v8a' } }
        x86_64 { dimension 'abi'; ndk { abiFilters 'x86_64' } }
    }
    sourceSets.main.python.srcDirs = ['../../']
    // Only the shared engine belongs in the APK, not build scripts/tests.
    sourceSets.main.python.include 'engine.py'
    packaging { jniLibs.useLegacyPackaging true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
apply from: rootProject.file('../../../android/signing.gradle')
